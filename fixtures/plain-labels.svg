<svg id="plain-labels" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 916.84375px;" viewBox="4 4 916.84375 251" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#plain-labels{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#plain-labels .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#plain-labels .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#plain-labels .error-icon{fill:#552222;}#plain-labels .error-text{fill:#552222;stroke:#552222;}#plain-labels .edge-thickness-normal{stroke-width:1px;}#plain-labels .edge-thickness-thick{stroke-width:3.5px;}#plain-labels .edge-pattern-solid{stroke-dasharray:0;}#plain-labels .edge-thickness-invisible{stroke-width:0;fill:none;}#plain-labels .edge-pattern-dashed{stroke-dasharray:3;}#plain-labels .edge-pattern-dotted{stroke-dasharray:2;}#plain-labels .marker{fill:#333333;stroke:#333333;}#plain-labels .marker.cross{stroke:#333333;}#plain-labels svg{font-family:Arial,Helvetica,sans-serif;font-size:16px;}#plain-labels p{margin:0;}#plain-labels .label{font-family:Arial,Helvetica,sans-serif;color:#333;}#plain-labels .cluster-label text{fill:#333;}#plain-labels .cluster-label span{color:#333;}#plain-labels .cluster-label span p{background-color:transparent;}#plain-labels .label text,#plain-labels span{fill:#333;color:#333;}#plain-labels .node rect,#plain-labels .node circle,#plain-labels .node ellipse,#plain-labels .node polygon,#plain-labels .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#plain-labels .rough-node .label text,#plain-labels .node .label text,#plain-labels .image-shape .label,#plain-labels .icon-shape .label{text-anchor:middle;}#plain-labels .node .katex path{fill:#000;s