<svg id="styles" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 936px;" viewBox="4 4 936 184" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#styles{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#styles .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#styles .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#styles .error-icon{fill:#552222;}#styles .error-text{fill:#552222;stroke:#552222;}#styles .edge-thickness-normal{stroke-width:1px;}#styles .edge-thickness-thick{stroke-width:3.5px;}#styles .edge-pattern-solid{stroke-dasharray:0;}#styles .edge-thickness-invisible{stroke-width:0;fill:none;}#styles .edge-pattern-dashed{stroke-dasharray:3;}#styles .edge-pattern-dotted{stroke-dasharray:2;}#styles .marker{fill:#333333;stroke:#333333;}#styles .marker.cross{stroke:#333333;}#styles svg{font-family:Arial,Helvetica,sans-serif;font-size:16px;}#styles p{margin:0;}#styles .label{font-family:Arial,Helvetica,sans-serif;color:#333;}#styles .cluster-label text{fill:#333;}#styles .cluster-label span{color:#333;}#styles .cluster-label span p{background-color:transparent;}#styles .label text,#styles span{fill:#333;color:#333;}#styles .node rect,#styles .node circle,#styles .node ellipse,#styles .node polygon,#styles .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#styles .rough-node .label text,#styles .node .label text,#styles .image-shape .label,#styles .icon-shape .label{text-anchor:middle;}#styles .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#styles .rough-node .label,#styles .node .label,#styles .image-shape .label,#styles .icon-shape .label{text-align:center;}#styles .node.clickable{cursor:pointer;}#styles .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#styles .arrowheadPath{fill:#333333;}#styles .edgePaths .path{stroke:#333333;stroke-width:1px;}#styles .flowchart-link{stroke:#333333;fill:none;}#styles .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#styles .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#styles .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#styles .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#styles .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#styles .cluster text{fill:#333;}#styles .cluster span{color:#333;}#styles .node .collapsed-indicator{fill:#aaaa33;stroke:none;opacity:0.6;}#styles .node .collapsed-separator{stroke:#aaaa33;stroke-width:0.75px;}#styles div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,Helvetica,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#styles .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#styles rect.text{fill:none;stroke-width:0;}#styles .icon-shape,#styles .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#styles .icon-shape p,#styles .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#styles .icon-shape .label rect,#styles .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#styles .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#styles .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#styles .node .neo-node{stroke:#9370DB;}#styles [data-look="neo"].node rect,#styles [data-look="neo"].cluster rect,#styles [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#styles [data-look="neo"].swimlane.cluster rect{filter:none;}#styles [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#styles [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#styles [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#styles [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#styles [data-look="neo"].node circle .state-start{fill:#000000;}#styles [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#styles [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#styles :root{--mermaid-font-family:Arial,Helvetica,sans-serif;}#styles .warn&gt;*{fill:rgb(255, 224, 138)!important;stroke:rgb(184, 134, 11)!important;stroke-width:2px!important;color:rgb(90, 61, 0)!important;font-weight:bold!important;}#styles .warn span{fill:rgb(255, 224, 138)!important;stroke:rgb(184, 134, 11)!important;stroke-width:2px!important;color:rgb(90, 61, 0)!important;font-weight:bold!important;}#styles .warn tspan{fill:rgb(90, 61, 0)!important;}</style><g><marker id="styles_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="styles_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="styles_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-wid